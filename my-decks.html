<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Decks — Memora</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="my-decks.css" />
</head>
<body>

  <header class="nav-bar">
    <a class="nav-bar__logo" href="my-decks.html">Memora</a>
    <a class="nav-bar__account-link" id="logoutLink" href="index.html">Log Out</a>
  </header>

  <main class="page-container mydecks-main">

    <section class="mydecks-header">
      <h1 class="mydecks-title">My Decks</h1>
      <div id="mydecksHeaderAction"></div>
    </section>

    <!-- Shown by my-decks.js only while at least one deck is saved. -->
    <div class="mydecks-search" id="mydecksSearch" role="search" hidden>
      <div class="form-field">
        <label for="mydecksSearchInput">Search decks</label>
        <input type="search" id="mydecksSearchInput" placeholder="Search by deck title" autocomplete="off" />
      </div>
    </div>

    <!-- Filled in by my-decks.js: the deck cards, or the empty message when there are none. -->
    <section class="mydecks-list" id="mydecksContent" aria-label="Your decks"></section>

  </main>

  <footer class="footer">
    <p>&copy; 2026 Memora</p>
  </footer>

  <!-- The delete confirmation is written in here by my-decks.js while it is open. -->
  <div id="mydecksModalRoot"></div>

  <script src="my-decks.js"></script>
</body>
</html>
