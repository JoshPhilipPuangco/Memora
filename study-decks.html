<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memora — Study Mode</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="study-decks.css" />
  <script src="study-decks.js" defer></script>
</head>
<body>
  <header class="nav-bar">
    <a class="nav-bar__logo" href="my-decks.html"><img class="nav-bar__logo-img" src="assets/logo.png" width="32" height="32" alt="" />Memora</a>
  </header>

  <main class="page-container study-main">
    <div class="study-content">
      <a class="btn-secondary study-back" href="my-decks.html">&larr; Back to My Decks</a>

      <div class="study-header" id="studyHeader">
        <h1 id="deckTitle">Study Mode</h1>
        <p class="helper-text" id="progressText" aria-live="polite"></p>
        <p class="helper-text" id="roundText"></p>
      </div>

      <!-- Shown by study-decks.js when there is no deck or no cards to study -->
      <div class="study-message" id="studyMessage" hidden>
        <p class="study-message__text" id="studyMessageText"></p>
      </div>

      <div class="flashcard study-flashcard" id="flashcard" tabindex="0" role="button">
        <svg class="flashcard__flip-icon study-flashcard__side-icon" viewBox="0 0 32 32"
             fill="none" aria-hidden="true">
          <rect class="study-flashcard__back-box" x="3" y="11" width="18" height="18" rx="4" stroke-width="2" />
          <rect class="study-flashcard__front-box" x="11" y="3" width="18" height="18" rx="4" stroke-width="2" />
        </svg>
        <p class="flashcard__question study-flashcard__text" id="cardQuestion"></p>
        <p class="flashcard__answer study-flashcard__text" id="cardAnswer"></p>
      </div>

      <div class="button-pair study-mark-row" id="studyMarkRow">
        <button class="btn-secondary-icon" id="markReviewedBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 6L9 17l-5-5" />
          </svg>
          Mark Reviewed
        </button>
        <button class="btn-secondary-icon" id="markNotReviewedBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M6 18L18 6M6 6l12 12" />
          </svg>
          Mark Not Yet Reviewed
        </button>
      </div>

      <div class="button-pair study-nav-row" id="studyNavRow">
        <button class="btn-secondary-icon" id="prevBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" />
          </svg>
          Previous card
        </button>
        <button class="btn-secondary-icon" id="nextBtn" type="button">
          Next card
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </button>
      </div>
    </div>
  </main>

  <!-- Finish dialog: opened by study-decks.js when a round ends or when a deck
       with saved progress is opened. Its text and buttons change per case. -->
  <div class="study-modal-overlay" id="studyModalOverlay">
    <section class="study-modal" role="dialog" aria-modal="true"
             aria-labelledby="studyModalTitle" aria-describedby="studyModalText">
      <h2 class="study-modal__title" id="studyModalTitle">Round complete</h2>
      <p class="study-modal__text" id="studyModalText"></p>
      <div class="study-modal__actions">
        <button class="btn-secondary" id="studyModalDismiss" type="button">Not now</button>
        <button class="btn-secondary" id="studyResetBtn" type="button">Reset progress</button>
        <button class="btn-primary" id="studyReviewMissedBtn" type="button">Review cards</button>
      </div>
    </section>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Memora · Free flashcards for college students · <a href="https://github.com/JoshPhilipPuangco/Memora">GitHub</a></p>
  </footer>
</body>
</html>
