<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memora — Study Mode</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="study-decks.css" />
  <script src="study-decks.js" defer></script>
</head>
<body>
  <header class="nav-bar">
    <a class="nav-bar__logo" href="my-decks.html">Memora</a>
  </header>

  <main class="page-container study-main">
    <a class="btn-secondary study-back" href="my-decks.html">&larr; Back to My Decks</a>

    <!-- Shown by study-decks.js when there is no deck or no cards to study -->
    <div class="study-message" id="studyMessage" hidden>
      <p class="study-message__text" id="studyMessageText"></p>
    </div>

    <div class="study-header" id="studyHeader">
      <h1 class="study-header__title" id="deckTitle"></h1>
      <p class="helper-text" id="progressText"></p>
    </div>

    <div class="flashcard" id="flashcard" tabindex="0" role="button"
         aria-label="Flashcard, click or press Enter to flip">
      <svg class="flashcard__flip-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M17 2.1l4 4-4 4" />
        <path d="M3 12.1v-2a4 4 0 0 1 4-4h14" />
        <path d="M7 21.9l-4-4 4-4" />
        <path d="M21 11.9v2a4 4 0 0 1-4 4H3" />
      </svg>
      <p class="flashcard__question" id="cardQuestion"></p>
      <p class="flashcard__answer" id="cardAnswer"></p>
    </div>

    <div class="button-pair study-mark-row" id="studyMarkRow">
      <button class="btn-secondary-icon" id="markReviewedBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M20 6L9 17l-5-5" />
        </svg>
        Mark Reviewed
      </button>
      <button class="btn-secondary-icon" id="markNotReviewedBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M6 18L18 6M6 6l12 12" />
        </svg>
        Mark Not Yet Reviewed
      </button>
    </div>

    <div class="button-pair study-nav-row" id="studyNavRow">
      <button class="btn-secondary-icon" id="prevBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" />
        </svg>
        Previous card
      </button>
      <button class="btn-secondary-icon" id="nextBtn" type="button">
        Next card
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M9 18l6-6-6-6" />
        </svg>
      </button>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Memora</p>
  </footer>
</body>
</html>
